name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/docs/build_site.py'
      - 'docs/help/fr-FR/screenshots/**'
      - 'assets/icons/assistant.png'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'tools/docs/build_site.py'
      - 'docs/help/fr-FR/screenshots/**'
      - 'assets/icons/assistant.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build website and validate publication scope
        run: python3 tools/docs/build_site.py --output artifacts/website
      - name: Upload only the generated website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/website
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
